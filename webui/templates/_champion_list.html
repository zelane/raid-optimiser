{% from "_macros.html" import tile, faction, lock_picker %}
{% if champions %}
  <div class="champion-grid">
    {% for listed in champions %}
      <article class="champion-card">
        <a href="/champions/{{ listed.champion.id }}" class="card-tile">{{ tile(listed.champion) }}</a>
        <a href="/champions/{{ listed.champion.id }}" class="card-name" title="{{ listed.champion.name }}">{{ faction(listed.champion) }}<span>{{ listed.short_name }}</span></a>
        {{ lock_picker(listed) }}
      </article>
    {% endfor %}
  </div>
{% else %}
  <p>No champions match.</p>
{% endif %}
