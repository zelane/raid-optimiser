[package]
name = "raid-host"
version = "0.1.0"
edition = "2021"
description = "Runs the game's own battle engine outside the game (its GameAssembly.dll, under Wine)"

[dependencies]
serde_json = "1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[profile.release]
strip = true
