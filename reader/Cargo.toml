[package]
name = "raid-reader"
version = "0.1.0"
edition = "2021"
description = "Reads the account out of the running game's memory (read-only, from outside the process)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[profile.release]
strip = true
