[project]
name = "raid-export"
version = "0.1.0"
description = "Raid account export (HH capture), game static data, and a MILP gear optimiser."
requires-python = ">=3.13"
dependencies = ["highspy>=1.15", "fastapi>=0.115", "uvicorn>=0.32", "jinja2>=3.1", "python-multipart>=0.0.20"]

[dependency-groups]
dev = ["black>=25", "ruff>=0.13", "pytest>=8"]
assets = ["UnityPy>=1.20"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.python-style]
paths = ["optimiser", "webui"]

[tool.pyright]
venvPath = "."
venv = ".venv"
