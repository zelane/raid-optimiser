[project]
name = "raid-optimiser"
version = "0.1.0"
description = "Raid account reader, game static data, and a MILP gear optimiser."
requires-python = ">=3.13"
dependencies = [
    "highspy>=1.15",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "orjson>=3.13.0",
    "click>=8.5.1",
    "msgpack>=1.2.4",
    "lz4>=4.4.5",
]

[dependency-groups]
dev = [
    "black>=25",
    "ruff>=0.13",
    "pytest>=8",
    "watchfiles>=1.0",
    "httpx2>=2.16.2",
]
assets = ["UnityPy>=1.20"]
capture = [
    "mitmproxy>=12.3.1",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.python-style]
paths = ["optimiser", "webui"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
